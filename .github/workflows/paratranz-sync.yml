name: Import ParaTranz snapshot
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'sync = read translations; plan = preview expansion; migrate = add original texts only'
        type: choice
        default: sync
        options: [sync, plan, migrate, apply-approved-baron-fix]
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: paratranz-snapshot
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Install artwork build dependency
        run: python3 -m pip install -r requirements-art.txt
      - name: Test converters and snapshot guards
        run: python3 -m unittest discover -s tests -v
      - name: Read or expand ParaTranz inventory
        env:
          PARATRANZ_TOKEN: ${{ secrets.PARATRANZ_TOKEN }}
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          case "$OPERATION" in
            plan) python3 tools/sync_inventory.py plan --out migration-plan ;;
            migrate) python3 tools/sync_inventory.py migrate --out incoming-inventory ;;
            sync) python3 tools/sync_inventory.py pull --out incoming-inventory ;;
            apply-approved-baron-fix) python3 tools/apply_baron_fix.py && python3 tools/sync_inventory.py pull --out incoming-inventory ;;
            *) echo 'Unsupported operation'; exit 1 ;;
          esac
      - name: Validate and build candidate
        if: inputs.operation != 'plan'
        run: python3 tools/inventory.py --input incoming-inventory --out build --mode translated
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sotm2-paratranz-inventory
          path: |
            build/
            migration-plan/
            incoming-inventory-checkpoints/
            incoming-inventory-resolved.json
          if-no-files-found: warn
      - name: Commit snapshot and open review PR
        if: inputs.operation != 'plan'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          cp -R incoming-inventory/. inventory-translations/
          cp incoming-inventory-resolved.json paratranz-inventory.json
          git add inventory-translations/ paratranz-inventory.json
          if git diff --cached --quiet; then
            echo 'No snapshot or file mapping changes.'
            exit 0
          fi
          branch="paratranz/snapshot-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Import validated ParaTranz inventory snapshot and file IDs'
          git push origin "$branch"
          python3 tools/pr_body.py build/build-report.json > "$RUNNER_TEMP/sotm2-pr.md"
          gh pr create --base "$BASE_BRANCH" --head "$branch" --title 'Update SotM2 translation inventory snapshot' --body-file "$RUNNER_TEMP/sotm2-pr.md"
