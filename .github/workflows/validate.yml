name: Validate localization
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test converter and snapshot guards
        run: python3 -m unittest discover -s tests -v
      - name: Build candidate from translation snapshot
        run: python3 tools/inventory.py --input inventory-translations --out build --mode translated
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Check semantic display transforms
        run: dotnet run --project tests/runtime/RuntimeChecks.csproj -- build/sample-texts.json
      - name: Check display coverage and untriaged observations
        run: python3 tools/coverage_audit.py check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sotm2-text-candidate
          path: build/
          if-no-files-found: error
